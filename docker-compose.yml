# Optional containerised run. The demo also runs fully without Docker (see README).
#   docker compose up --build   ->   http://127.0.0.1:8000/
services:
  aman-gate:
    build: .
    image: aman-gate:local
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AMAN_ENV: "demo"
      # Demo secrets are acceptable only because AMAN_ENV=demo. For a non-demo run, set strong values:
      AMAN_JWT_SECRET: "nonproduction-demo-jwt-secret-change-me-0001"
      AMAN_AUDIT_HMAC_KEY: "nonproduction-demo-audit-hmac-key-change-me-0001"
      AMAN_DATABASE_URL: "sqlite:////app/backend/data/aman_gate.db"
    volumes:
      - aman_data:/app/backend/data
    # No outbound network is required by the app. 'internal: true' makes the demo's isolation explicit.
    networks:
      - amannet

volumes:
  aman_data:

networks:
  amannet:
    driver: bridge
